<circle cx="1110" cy="430" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="435" font-size="14">J1.4 EN</text>
<circle cx="1110" cy="470" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="475" font-size="14">J1.5 GND</text>
<circle cx="1110" cy="510" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="515" font-size="14">J1.6 VBUS</text>
<circle cx="1110" cy="550" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="555" font-size="14">J1.7 STAT</text>
<circle cx="1110" cy="590" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="595" font-size="14">J1.8 VBAT</text>
<circle cx="1110" cy="630" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="635" font-size="14">J1.9 BSNS</text>
<rect x="60" y="460" width="300" height="170" rx="10" fill="#f6eee0" stroke="#333" stroke-width="2"/>
<text x="210.0" y="488" font-size="19" font-weight="bold" text-anchor="middle">18650 holder MPD BH-18650-PC</text>
<text x="210.0" y="510" font-size="13" fill="#333" text-anchor="middle">protected button-top cell</text>
<text x="210.0" y="528" font-size="13" fill="#333" text-anchor="middle">+ pin at the USB end, - at the jack end</text>
<circle cx="360" cy="550" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="555" font-size="14" text-anchor="end">+ (red)</text>
<circle cx="360" cy="590" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="595" font-size="14" text-anchor="end">- (black)</text>
<rect x="60" y="190" width="300" height="200" rx="10" fill="#eef" stroke="#333" stroke-width="2"/>
<text x="210.0" y="218" font-size="19" font-weight="bold" text-anchor="middle">RDA5807M FM module</text>
<text x="210.0" y="240" font-size="13" fill="#333" text-anchor="middle">26.9 x 26.9, 3.5 mm jack on board</text>
<text x="210.0" y="258" font-size="13" fill="#333" text-anchor="middle">I2C 0x10 / 0x11, 3.3 V</text>
<circle cx="360" cy="280" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="285" font-size="14" text-anchor="end">VCC</text>
<circle cx="360" cy="310" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="315" font-size="14" text-anchor="end">GND</text>
<circle cx="360" cy="340" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="345" font-size="14" text-anchor="end">SDA</text>
<circle cx="360" cy="370" r="6" fill="#d4a017" stroke="#333"/>
<text x="348" y="375" font-size="14" text-anchor="end">SCL</text>
<path d="M360,550 L470,550 L470,580 L520,580" fill="none" stroke="#d22" stroke-width="4" stroke-linejoin="round" />
<text x="372" y="542" font-size="12" fill="#222">JST PH cable (#261) red</text>
<path d="M360,590 L490,590 L490,620 L520,620" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" />
<text x="372" y="610" font-size="12" fill="#222">black</text>
<path d="M850,630 L880,630 L880,800 L400,800 L400,280 L360,280" fill="none" stroke="#d22" stroke-width="4" stroke-linejoin="round" />
<path d="M850,670 L894,670 L894,814 L414,814 L414,310 L360,310" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" />
