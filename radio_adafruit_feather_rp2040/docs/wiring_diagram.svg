<text x="72" y="808" font-size="11.5" fill="#666" text-anchor="start">holder PC pins trimmed, wires soldered on (joints in the floor relief holes)</text>
<path d="M620,270 L620,1000 L1745,1000" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
