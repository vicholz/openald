<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1800" height="1320" fill="white"/>
<text x="30" y="42" font-size="26" fill="#222" text-anchor="start" font-weight="bold">OpenALD Feather RP2040 v1.0 — wiring diagram (t116u: Feather's own USB-C is the bottom-end dock port)</text>
<text x="30" y="70" font-size="14" fill="#555" text-anchor="start">Every line is a hand-soldered wire (28–30 AWG silicone unless noted). Wire colours are suggestions. No breakout, no Schottky, no JST or STEMMA QT plugs (no room at the walls). Designed from datasheets only — NOT built or tested on hardware.</text>
<rect x="700" y="140" width="300" height="800" rx="10" fill="#e8f4ea" stroke="#333" stroke-width="2"/>
<text x="850.0" y="166" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Adafruit Feather RP2040</text>
<text x="850.0" y="186" font-size="12.5" fill="#444" text-anchor="middle">#4884, components up, flat at the bottom end,</text>
<text x="850.0" y="203" font-size="12.5" fill="#444" text-anchor="middle">its USB-C = the dock port (case bottom face)</text>
<circle cx="700" cy="310" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="712" y="315" font-size="14" fill="#222" text-anchor="start">SDA = GP2</text>
<text x="712" y="331" font-size="11" fill="#666" text-anchor="start">JP3.12 (left header)</text>
<circle cx="700" cy="350" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="712" y="355" font-size="14" fill="#222" text-anchor="start">SCL = GP3</text>
<text x="712" y="371" font-size="11" fill="#666" text-anchor="start">JP3.11</text>
<circle cx="700" cy="503" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="712" y="508" font-size="14" fill="#222" text-anchor="start">EN</text>
<text x="712" y="524" font-size="11" fill="#666" text-anchor="start">JP3.2</text>
<circle cx="700" cy="750" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="712" y="755" font-size="14" fill="#222" text-anchor="start">BAT (VBAT)</text>
<text x="712" y="771" font-size="11" fill="#666" text-anchor="start">JP3.1</text>
<circle cx="1000" cy="230" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="235" font-size="14" fill="#222" text-anchor="end">3V3</text>
<text x="988" y="251" font-size="11" fill="#666" text-anchor="end">JP1.14 (right header)</text>
<circle cx="1000" cy="310" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="315" font-size="14" fill="#222" text-anchor="end">D24 = GP24</text>
<text x="988" y="331" font-size="11" fill="#666" text-anchor="end">JP1.8</text>
<circle cx="1000" cy="350" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="355" font-size="14" fill="#222" text-anchor="end">D25 = GP25</text>
<text x="988" y="371" font-size="11" fill="#666" text-anchor="end">JP1.7</text>
<circle cx="1000" cy="390" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="395" font-size="14" fill="#222" text-anchor="end">D4 = GP6</text>
<text x="988" y="411" font-size="11" fill="#666" text-anchor="end">JP1.1 (NOT GPIO 4)</text>
<circle cx="1000" cy="450" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="455" font-size="14" fill="#222" text-anchor="end">GND</text>
<text x="988" y="471" font-size="11" fill="#666" text-anchor="end">JP1.13, the only GND pin</text>
<circle cx="1000" cy="600" r="6" fill="#e0b020" stroke="#333" stroke-width="1.5"/>
<text x="988" y="605" font-size="14" fill="#222" text-anchor="end">A0 = GP26 / ADC0</text>
<text x="988" y="621" font-size="11" fill="#666" text-anchor="end">JP1.12</text>
<text x="850.0" y="820" font-size="12" fill="#444" text-anchor="middle">on board, seen through the front-face holes:</text>
<text x="850.0" y="837" font-size="12" fill="#444" text-anchor="middle">CHG LED (amber, MCP73831 charger 200 mA),</text>
<text x="850.0" y="854" font-size="12" fill="#444" text-anchor="middle">red LED GP13, NeoPixel GP16 (battery level).</text>
<text x="850.0" y="871" font-size="12" fill="#444" text-anchor="middle">EN low = 3.3 V regulator off.</text>
<text x="850.0" y="888" font-size="12" fill="#444" text-anchor="middle">JST PH socket: leave EMPTY (BAT pad used).</text>
