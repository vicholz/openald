<path d="M1543.5,584 L1543.5,616" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1537.5" y="576" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">C1 100 nF</text>
<text x="1095" y="665" font-size="12" fill="#444" text-anchor="start">A0 = VBAT / 2   (≈ 9.5 µA always, also when switched off)</text>
<rect x="1080" y="720" width="630" height="130" rx="8" fill="#f4fff4" stroke="#5a5" stroke-width="2"/>
<text x="1095" y="742" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Status LEDs — nothing to wire</text>
<text x="1095" y="766" font-size="12" fill="#444" text-anchor="start">The Feather's own CHG LED (charging, amber), red LED (GP13) and NeoPixel (GP16, battery</text>
<text x="1095" y="786" font-size="12" fill="#444" text-anchor="start">level) sit under light tunnels to holes in the front face, so charging is visible in the dock.</text>
<text x="1095" y="806" font-size="12" fill="#444" text-anchor="start">The battery display stays on the NeoPixel (not moved to the front).</text>
<text x="30" y="1050" font-size="18" fill="#222" text-anchor="start" font-weight="bold">Notes</text>
<text x="40" y="1080" font-size="14" fill="#222" text-anchor="start">• Polarity: holder + pin (USB end) → BAT pad, − pin → GND. Check with a meter before inserting the cell; the JST socket stays empty.</text>
<text x="40" y="1106" font-size="14" fill="#222" text-anchor="start">• Switch: before soldering, check with a meter which outer lug connects to the middle lug with the knob at the OFF (USB-end) position; that lug goes to GND.</text>
<text x="40" y="1132" font-size="14" fill="#222" text-anchor="start">• Wheel: check the A / B / S / C tab markings on your part's datasheet drawing. If A and B are swapped, the wheel just counts the other way (swap PIN_ENC_A / PIN_ENC_B).</text>
<text x="40" y="1158" font-size="14" fill="#222" text-anchor="start">• Use the silkscreen names: D4 is RP2040 GPIO 6 on this board. The firmware uses GPIO numbers 24, 25, 6, 26 (A0), 2/3 (I2C), 16 (NeoPixel).</text>
<text x="40" y="1184" font-size="14" fill="#222" text-anchor="start">• With the switch OFF (EN low) the 3.3 V rail is off: Feather, FM module and NeoPixel are unpowered. Charging still works (MCP73831 runs from VBUS).</text>
<text x="40" y="1210" font-size="14" fill="#222" text-anchor="start">• No wheel-push battery check with the switch OFF (the single board can; the Feather cannot). The firmware flashes the level at power-on and on a short press.</text>
<text x="40" y="1236" font-size="14" fill="#222" text-anchor="start">• Wire lengths ~120 mm per lead; wires run in the side channels under the deck and come up through the deck slots, as in the README.</text>
<text x="40" y="1262" font-size="14" fill="#222" text-anchor="start">• Part numbers, prices and sources: docs/BOM.md. Pin table: docs/pin_map.md. KiCad schematic: docs/wiring_schematic/ (ERC-checked).</text>
</svg>