<path d="M850,750 L922,750 L922,842 L442,842 L442,370 L360,370" fill="none" stroke="#cc0" stroke-width="4" stroke-linejoin="round" />
<text x="685.0" y="880" font-size="13" text-anchor="middle">STEMMA QT cable (Adafruit #4210, one end cut and soldered to the FM module): red 3V3, black GND, blue SDA, yellow SCL</text>
<path d="M850,455 L960,455 L960,310 L1110,310" fill="none" stroke="#7a3" stroke-width="4" stroke-linejoin="round" />
<path d="M850,495 L976,495 L976,350 L1110,350" fill="none" stroke="#3a7" stroke-width="4" stroke-linejoin="round" />
<path d="M850,535 L992,535 L992,390 L1110,390" fill="none" stroke="#a73" stroke-width="4" stroke-linejoin="round" />
<path d="M850,375 L1008,375 L1008,470 L1110,470" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" />
<path d="M850,415 L1024,415 L1024,630 L1110,630" fill="none" stroke="#888" stroke-width="4" stroke-linejoin="round" />
<path d="M520,415 L496,415 L496,136 L1080,136 L1080,430 L1110,430" fill="none" stroke="#f80" stroke-width="4" stroke-linejoin="round" />
<path d="M520,455 L484,455 L484,122 L1066,122 L1066,510 L1110,510" fill="none" stroke="#d22" stroke-width="4" stroke-linejoin="round" />
<path d="M520,495 L472,495 L472,108 L1052,108 L1052,550 L1110,550" fill="none" stroke="#a0a" stroke-width="4" stroke-linejoin="round" stroke-dasharray='10,6'/>
<path d="M520,375 L460,375 L460,94 L1038,94 L1038,590 L1110,590" fill="none" stroke="#c55" stroke-width="4" stroke-linejoin="round" />
<text x="1100" y="740" font-size="13">J1: 9 THT pads, 1.8 mm pitch; wires come up through the frame slot.</text>
<text x="1100" y="760" font-size="13">SW1 common = EN; knob toward the USB end = EN to GND = OFF.</text>
<text x="1100" y="780" font-size="13">STAT (dashed) is a fine wire to the STAT end of Feather R2 (10k,</text>
<text x="1100" y="798" font-size="13">CHG LED resistor). Optional: skip it and fit no D1/D2.</text>
</svg>