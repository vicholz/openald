<text x="1545.0" y="186" font-size="12.5" fill="#444" text-anchor="middle">right wall, between the Feather and the FM</text>
<text x="1545.0" y="203" font-size="12.5" fill="#444" text-anchor="middle">tab order USB end → top: B, C, S, A</text>
<text x="1545.0" y="220" font-size="12.5" fill="#444" text-anchor="middle">S closes to C when pushed</text>
