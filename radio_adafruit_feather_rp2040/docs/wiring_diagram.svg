<path d="M1690,350 L1745,350" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1200" y="298" font-size="12.5" fill="#444" text-anchor="middle">internal pull-ups, no RC filter</text>
<rect x="1080" y="500" width="630" height="180" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
