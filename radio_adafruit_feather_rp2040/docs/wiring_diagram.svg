<text x="225.0" y="203" font-size="12.5" fill="#444" text-anchor="middle">I2C 0x10 / 0x11, 3.3 V</text>
<text x="225.0" y="220" font-size="12.5" fill="#444" text-anchor="middle">headphone cable = antenna</text>
