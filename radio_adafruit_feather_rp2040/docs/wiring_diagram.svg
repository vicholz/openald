<text x="1537.5" y="542" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">R2 220k</text>
<circle cx="1330" cy="560" r="6.5" fill="#111"/>
<path d="M1330,560 L1330,600" fill="none" stroke="#777" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
