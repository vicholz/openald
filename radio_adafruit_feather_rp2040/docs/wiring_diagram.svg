<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1010" viewBox="0 0 1560 1010" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1560" height="1010" fill="white"/>
<text x="30" y="42" font-size="26" font-weight="bold">OpenALD Feather RP2040 v1.0 - wiring</text>
<text x="30" y="70" font-size="15" fill="#555">All wires are hand-soldered. Not hardware-validated. Wire colours are suggestions. FM module pin order: check the silkscreen on yours.</text>
<rect x="520" y="160" width="330" height="600" rx="10" fill="#e8f4ea" stroke="#333" stroke-width="2"/>
<text x="685.0" y="188" font-size="19" font-weight="bold" text-anchor="middle">Adafruit Feather RP2040</text>
<text x="685.0" y="210" font-size="13" fill="#333" text-anchor="middle">(#4884, mounted components-up,</text>
<text x="685.0" y="228" font-size="13" fill="#333" text-anchor="middle">USB-C at the dock end)</text>
<circle cx="520" cy="375" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="380" font-size="14">VBAT</text>
<circle cx="520" cy="415" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="420" font-size="14">EN</text>
<circle cx="520" cy="455" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="460" font-size="14">USB (VBUS)</text>
<circle cx="520" cy="495" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="500" font-size="14">STAT tap: R2 pad (STAT side)</text>
<circle cx="520" cy="580" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="585" font-size="14">JST PH battery +</text>
<circle cx="520" cy="620" r="6" fill="#d4a017" stroke="#333"/>
<text x="532" y="625" font-size="14">JST PH battery -</text>
<circle cx="850" cy="375" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="380" font-size="14" text-anchor="end">GND</text>
<circle cx="850" cy="415" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="420" font-size="14" text-anchor="end">A0 (GP26)</text>
<circle cx="850" cy="455" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="460" font-size="14" text-anchor="end">D24 (GP24)</text>
<circle cx="850" cy="495" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="500" font-size="14" text-anchor="end">D25 (GP25)</text>
<circle cx="850" cy="535" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="540" font-size="14" text-anchor="end">D4 (GP6)</text>
<circle cx="850" cy="630" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="635" font-size="14" text-anchor="end">STEMMA QT 3V3</text>
<circle cx="850" cy="670" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="675" font-size="14" text-anchor="end">STEMMA QT GND</text>
<circle cx="850" cy="710" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="715" font-size="14" text-anchor="end">STEMMA QT SDA (GP2)</text>
<circle cx="850" cy="750" r="6" fill="#d4a017" stroke="#333"/>
<text x="838" y="755" font-size="14" text-anchor="end">STEMMA QT SCL (GP3)</text>
<text x="685.0" y="252" font-size="13" text-anchor="middle" fill="#333">On-board: MCP73831 charger 200 mA, CHG LED (amber),</text>
<text x="685.0" y="270" font-size="13" text-anchor="middle" fill="#333">red LED D13, NeoPixel - all seen through top windows.</text>
<text x="685.0" y="288" font-size="13" text-anchor="middle" fill="#333">EN low = 3.3 V regulator off (radio off).</text>
<rect x="1110" y="190" width="380" height="520" rx="10" fill="#e6eefb" stroke="#333" stroke-width="2"/>
<text x="1300.0" y="218" font-size="19" font-weight="bold" text-anchor="middle">Controls board (KiCad, JLC)</text>
<text x="1300.0" y="240" font-size="13" fill="#333" text-anchor="middle">SIQ-02FVS3 wheel + push, SK-12E12 switch,</text>
<text x="1300.0" y="258" font-size="13" fill="#333" text-anchor="middle">220k/220k divider, CHG/FULL mirror LEDs</text>
<circle cx="1110" cy="310" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="315" font-size="14">J1.1 ENCA</text>
<circle cx="1110" cy="350" r="6" fill="#d4a017" stroke="#333"/>
<text x="1122" y="355" font-size="14">J1.2 ENCB</text>
<circle cx="1110" cy="390" r="6" fill="#d4a017" stroke="#333"/>
